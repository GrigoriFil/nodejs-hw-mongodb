tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieves a paginated list of contacts for the authenticated user with optional filtering and sorting.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: The page number for pagination.
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: The number of contacts per page.
    schema:
      type: integer
      default: 10
  - name: sortBy
    in: query
    description: The field to sort by.
    schema:
      type: string
      enum: [name, email, contactType]
      default: name
  - name: sortOrder
    in: query
    description: The sort order.
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  - name: type
    in: query
    description: Filter by contact type.
    schema:
      type: string
      enum: [work, home, personal]
  - name: isFavourite
    in: query
    description: Filter by favourite status.
    schema:
      type: boolean
responses:

  '200':
    $ref: '../../components/responses/200-ContactsListFound.yaml'
  
  '401':
    $ref: '../../components/responses/401-Unauthorized.yaml'