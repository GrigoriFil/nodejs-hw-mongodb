tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieves a paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: The page number for pagination.
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: The number of contacts per page.
    schema:
      type: integer
      default: 10
responses:
  '200':
    description: A list of contacts.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '../../components/schemas/Contact.yaml'
  '401':
    $ref: '../../components/responses/401-Unauthorized.yaml'
