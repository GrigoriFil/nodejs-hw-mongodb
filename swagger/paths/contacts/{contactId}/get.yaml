tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Retrieves the details of a specific contact belonging to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: ID of the contact to retrieve
    required: true
    schema:
      type: string
      example: '667d7f7b1e5d7d3d7f7b1e5d'
responses:
  '200':
    description: Contact details retrieved successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/200-ContactFound.yaml'
  '401':
    $ref: '../../../components/responses/401-Unauthorized.yaml'
  '404':
    $ref: '../../../components/responses/404-NotFound.yaml'
