tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContactById
description: Updates an existing contact's information for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: ID of the contact to update
    required: true
    schema:
      type: string
      example: '667d7f7b1e5d7d3d7f7b1e5d'
requestBody:
  description: The contact data to update.
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The new name of the contact.
          email:
            type: string
            format: email
            description: The new email of the contact.
          phoneNumber:
            type: string
            description: The new phone number of the contact.
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
            description: A new photo file for the contact.
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/200-ContactUpdated.yaml'
  '401':
    $ref: '../../../components/responses/401-Unauthorized.yaml'
  '404':
    $ref: '../../../components/responses/404-NotFound.yaml'
